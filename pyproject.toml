[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily_news_agent"
version = "0.1.0"
description = "Daily Top News Summary AI Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-adk>=0.1.0",
    "google-cloud-firestore>=2.11.0",
    "tenacity>=8.2.0",
    "markdown>=3.4.0",
    "nh3>=0.2.14",
    "pydantic>=2.0.0",
    "tzdata>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = "test_*.py"
